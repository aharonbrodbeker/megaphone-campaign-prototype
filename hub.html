<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>transparent-histadrut / megaphone · Megaphone Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;
  --yellow:#FFD21E;--r:8px;
  --sans:'Source Sans 3',Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--g800);background:#fff;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{flex:none;vertical-align:middle}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}
.muted{color:var(--g500)}
.sm{font-size:13px}
b,strong{font-weight:600;color:var(--g900)}

/* nav */
.topnav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--g100)}
.nav-inner{display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;white-space:nowrap;color:var(--g900)}
.mark{width:28px;height:28px;border-radius:8px;background:var(--yellow);display:grid;place-items:center;color:#111;flex:none}
.mark.sm{width:22px;height:22px;border-radius:6px}
.mark.xs{width:18px;height:18px;border-radius:5px}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:400px;height:34px;padding:0 10px;border:1px solid var(--g200);border-radius:8px;background:#fff;color:var(--g400)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--g800);font-size:14px}
.search:focus-within{border-color:var(--g300);box-shadow:0 0 0 3px var(--g100)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--g200);border-radius:4px;padding:0 5px;color:var(--g400)}
.navlinks{display:flex;gap:2px;margin-left:auto}
.navlinks a{padding:6px 10px;border-radius:6px;font-size:14px;color:var(--g600);display:flex;align-items:center;gap:6px}
.navlinks a:hover{color:var(--g900);background:var(--g50)}
.nav-right{display:flex;align-items:center;gap:10px}
.team-toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--g200);background:#fff;border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600}
.team-toggle:hover{border-color:var(--g300)}
.switch{width:30px;height:18px;border-radius:999px;background:var(--g300);position:relative;transition:background .2s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--g900)}
.switch.on::after{left:14px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#fde68a,#fca5a5);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--g800);flex:none}
.avatar.xs{width:20px;height:20px;font-size:9px}
.avatar.md{width:34px;height:34px;font-size:12px;background:linear-gradient(135deg,#e0e7ff,#bae6fd)}

/* repo header */
.repo-head{background:linear-gradient(to top,var(--g50),#fff);border-bottom:1px solid var(--g200);padding-top:22px}
.repo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.repo-title{display:flex;align-items:center;gap:8px;font-size:20px;flex-wrap:wrap}
.repo-title .org{color:var(--g500)}
.repo-title .org:hover{color:var(--g900)}
.slash{color:var(--g300)}
.repo-title b{font-weight:700}
.icon-btn{border:0;background:transparent;color:var(--g400);padding:4px;border-radius:6px;display:inline-flex}
.icon-btn:hover{color:var(--g700);background:var(--g100)}
.counter{display:inline-flex;align-items:stretch;border:1px solid var(--g200);border-radius:8px;overflow:hidden;font-size:14px;background:#fff}
.counter button{display:flex;align-items:center;gap:6px;border:0;background:#fff;padding:3px 10px}
.counter button:hover{background:var(--g50)}
.counter .n{padding:3px 10px;border-left:1px solid var(--g200);font-weight:600;display:flex;align-items:center}
.counter.active button{color:#e11d48}
.head-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;font-size:13px;border:1px solid var(--g200);background:#fff;color:var(--g700);white-space:nowrap;line-height:1}
.tag.sm{height:20px;font-size:12px;padding:0 6px}
.tag .lbl{color:var(--g400)}
.t-green{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.t-blue{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.t-purple{background:#faf5ff;border-color:#e9d5ff;color:#7e22ce}
.t-amber{background:#fffbeb;border-color:#fde68a;color:#b45309}
.t-red{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.t-pink{background:#fdf2f8;border-color:#fbcfe8;color:#be185d}
.t-orange{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
.t-gray{background:var(--g50);border-color:var(--g200);color:var(--g600)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:flex;align-items:center;gap:7px;padding:10px 12px;font-size:15px;color:var(--g500);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--g800)}
.tabs a.active{color:var(--g900);border-bottom-color:var(--g900);font-weight:600}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--g900);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.badge.zero{background:var(--g200);color:var(--g500)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--g200);background:#fff;font-size:14px;font-weight:600;color:var(--g800);white-space:nowrap}
.btn:hover{background:var(--g50)}
.btn.primary{background:var(--g900);border-color:var(--g900);color:#fff}
.btn.primary:hover{background:#000}
.btn.danger{color:#b91c1c}
.btn.danger:hover{background:#fef2f2;border-color:#fecaca}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.paused{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:#2563eb;cursor:pointer}
.link:hover{text-decoration:underline}
.input{height:34px;border:1px solid var(--g200);border-radius:8px;padding:0 10px;background:#fff;outline:0;font-size:14px;min-width:0}
.input:focus{border-color:var(--g400);box-shadow:0 0 0 3px var(--g100)}
.select{height:32px;border:1px solid var(--g200);border-radius:8px;padding:0 8px;background:#fff;font-size:14px;outline:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--g200);background:#fff;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--g600)}
.chip:hover{border-color:var(--g400);color:var(--g900)}
.chip.on{background:var(--g900);border-color:var(--g900);color:#fff}
.chip .c{color:var(--g400)}
.chip.on .c{color:var(--g300)}
.chip .x{border:0;background:none;color:inherit;padding:0 0 0 4px;font-size:15px;line-height:1}

/* layout */
.view{padding-top:28px;padding-bottom:64px;min-height:60vh}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.card{border:1px solid var(--g200);border-radius:var(--r);background:#fff}
.card-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--g200);background:var(--g50);border-radius:8px 8px 0 0;font-size:14px;color:var(--g600);flex-wrap:wrap}
.card-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pad{padding:16px}
.section-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--g900);margin:30px 0 10px}
.section-title:first-child{margin-top:0}
.section-title .count{font-weight:500;color:var(--g400)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--g200);background:var(--g50);border-radius:8px;font-size:14px;color:var(--g600);margin-bottom:16px}
.empty{padding:28px;text-align:center;color:var(--g500);font-size:14px}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{border:1px solid var(--g200);border-radius:8px;padding:12px 14px;background:#fff}
.stat .k{font-size:13px;color:var(--g500);display:flex;align-items:center;gap:6px}
.stat .v{font-size:22px;font-weight:700;color:var(--g900);line-height:1.2;margin-top:2px}
.stat .v small{font-size:13px;font-weight:500;color:var(--g400)}

/* readme */
.md{padding:6px 28px 28px}
.md h1{font-size:30px;margin:18px 0 6px;color:var(--g900);line-height:1.2}
.md h2{font-size:20px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--g100);color:var(--g900)}
.md h3{font-size:15px;margin:0 0 6px;color:var(--g900)}
.md p{margin:0 0 12px;color:var(--g700)}
.md ul,.md ol{margin:0 0 12px;padding-left:22px;color:var(--g700)}
.md li{margin:4px 0}
.md a{color:#2563eb}
.md a:hover{text-decoration:underline}
.md code{font-family:var(--mono);font-size:13px;background:var(--g100);padding:1px 5px;border-radius:4px}
.md table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}
.md th,.md td{text-align:left;padding:7px 10px;border:1px solid var(--g200)}
.md th{background:var(--g50);font-weight:600}
.md blockquote{margin:0 0 12px;padding:6px 14px;border-left:3px solid var(--yellow);color:var(--g600);background:#fffdf2;border-radius:0 6px 6px 0}
.md pre{font-family:var(--mono);font-size:13px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:12px 14px;overflow:auto;margin:0 0 12px}
.md .lead{font-size:18px;color:var(--g600)}
.redline{list-style:none;padding-left:0!important}
.redline li{display:flex;gap:8px;align-items:flex-start}
.redline svg{color:#dc2626;margin-top:3px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.cols2 > div{border:1px solid var(--g200);border-radius:8px;padding:12px 14px}
.cols2 ul{margin:0}
.hl{background:linear-gradient(transparent 58%,rgba(255,210,30,.55) 58%)}

/* sidebar */
.side{display:flex;flex-direction:column;gap:20px}
.side section{padding-bottom:20px;border-bottom:1px solid var(--g100)}
.side section:last-child{border-bottom:0}
.side-label{font-size:13px;color:var(--g500);display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.side-label a{color:var(--g400)}
.side-label a:hover{color:var(--g800)}
.big{font-size:26px;font-weight:700;color:var(--g900);line-height:1.1}
.spark{display:block;width:100%;height:46px;margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
a.tag:hover{filter:brightness(.97)}
.bar{height:8px;border-radius:999px;background:var(--g100);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--g900);border-radius:999px;transition:width .3s}
.bar.warn > span{background:#f59e0b}
.bar.full > span{background:#dc2626}
.bar.y > span{background:var(--yellow)}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--g500);margin-top:6px}
.live{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--g700)}
.live .dot{margin-top:7px}
#liveText{transition:opacity .25s}
.mini-ask{display:flex;gap:6px;margin-bottom:8px}
.mini-ask .input{flex:1}

/* activity */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.list{border:1px solid var(--g200);border-radius:8px;overflow:hidden;background:#fff}
.list-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--g50);border-bottom:1px solid var(--g200);font-size:14px;color:var(--g600);flex-wrap:wrap}
.list-head .trunc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.list-head .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.arow{display:grid;grid-template-columns:22px 128px minmax(0,1fr) 64px 48px 72px;gap:12px;align-items:center;width:100%;padding:9px 14px;border:0;border-bottom:1px solid var(--g100);background:#fff;text-align:left;font-size:14px}
.arow:last-child{border-bottom:0}
.arow:hover{background:var(--g50)}
.arow .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--g800)}
.arow .id,.arow .time,.arow .cost{font-family:var(--mono);font-size:12.5px;color:var(--g500)}
.arow .cost{text-align:right}
.arow .tool{overflow:hidden}
.arow.new{animation:flash 1.6s ease}
@keyframes flash{from{background:#fff7d1}to{background:#fff}}
.s-green{color:#16a34a;display:inline-flex}
.s-amber{color:#d97706;display:inline-flex}
.s-red{color:#dc2626;display:inline-flex}
.s-gray{color:var(--g400);display:inline-flex}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;border-left:1px solid var(--g200);box-shadow:-12px 0 32px rgba(0,0,0,.06);transform:translateX(100%);transition:transform .25s ease;z-index:41;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--g200);background:var(--g50)}
.drawer-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.drawer-body{padding:18px 20px 28px;overflow:auto;flex:1}
.drawer-body h3{margin:0 0 4px;font-size:19px;color:var(--g900);line-height:1.3}
.drawer-foot{padding:12px 18px;border-top:1px solid var(--g200);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:12px 0 0}
.kv dt{color:var(--g500)}
.kv dd{margin:0;color:var(--g800);min-width:0;overflow-wrap:anywhere}
.sec{margin-top:20px}
.sec h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--g500);font-weight:600}
.sec p{margin:0;color:var(--g700);font-size:14.5px}
pre.json{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:12px 14px;margin:0;overflow:auto;white-space:pre-wrap;word-break:break-word;color:var(--g700)}
.jk{color:#7e22ce}.js{color:#047857}.jn{color:#b45309}
.policy{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border-width:1px;border-style:solid;font-size:14px}
.policy p{color:inherit}
.costs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.costs div{border:1px solid var(--g200);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--g500)}
.costs b{display:block;font-family:var(--mono);font-size:14px;font-weight:500}

/* approvals */
.disc{border-bottom:1px solid var(--g100)}
.disc:last-child{border-bottom:0}
.disc.blocked{background:#fffafa}
.disc-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:transparent;border:0;text-align:left}
.disc-row:hover{background:var(--g50)}
.disc-ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;border-width:1px;border-style:solid}
.disc-main{flex:1;min-width:0}
.disc-title{display:block;font-weight:600;color:var(--g900);font-size:15px}
.disc-sub{display:block;font-size:13px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc-meta{display:flex;align-items:center;gap:10px;flex:none}
.chev{display:inline-flex;transition:transform .2s;color:var(--g400)}
.disc.open .chev{transform:rotate(90deg)}
.disc-body{display:none;padding:4px 14px 18px 60px}
.disc.open .disc-body{display:block}
.disc-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.disc-grid h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--g500);font-weight:600}
.disc-grid p{margin:0 0 4px;font-size:14px;color:var(--g700)}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.pv{border:1px solid var(--g200);border-radius:8px;background:#fff;overflow:hidden}
.pv-head{padding:8px 12px;background:var(--g50);border-bottom:1px solid var(--g200);font-size:13px;color:var(--g500);display:flex;gap:6px;align-items:center}
.pv-body{padding:12px 14px;font-size:14px;color:var(--g800)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.tweet{display:flex;gap:10px}
.tw-av{width:36px;height:36px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:none;color:#111}
.tw-av.sm{width:30px;height:30px}
.src{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:0 6px;border-radius:5px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;vertical-align:1px;white-space:nowrap;line-height:18px}
textarea.edit{width:100%;min-height:170px;border:1px solid var(--g300);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:13px;line-height:1.6;outline:0;resize:vertical;background:#fff}
textarea.edit:focus{border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--g500)}
.field .input{width:100%}
.res-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--g100);font-size:14px;flex-wrap:wrap}
.res-row:last-child{border-bottom:0}

/* prompt */
.file-meta{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--g200);font-size:14px;color:var(--g600);flex-wrap:wrap}
.file-meta .right{margin-left:auto}
.code{overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.7;padding:8px 0}
.code table{border-collapse:collapse;width:100%}
.code td{padding:0 14px;vertical-align:top}
.code .ln{width:1%;text-align:right;color:var(--g300);user-select:none;padding-left:16px;border-right:1px solid var(--g100);white-space:nowrap}
.code .lc{white-space:pre-wrap;word-break:break-word;color:var(--g800)}
.code tr:hover td{background:#fffbe6}
.code .h{color:#7e22ce;font-weight:500}
.code .b{color:var(--g400)}
.code .q{color:#047857}
.commit{border-top:1px solid var(--g200);padding:14px;background:var(--g50);border-radius:0 0 8px 8px}
.commit h4{margin:0 0 8px;font-size:15px;color:var(--g900)}
.prompt-edit{padding:12px}
.prompt-edit textarea{min-height:420px}
.hash{font-family:var(--mono);font-size:12px;color:var(--g600);background:var(--g100);border-radius:4px;padding:0 5px}
.hist-row{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--g100);font-size:14px;align-items:flex-start}
.hist-row:last-child{border-bottom:0}
.hist-row .body{flex:1;min-width:0}
.hist-row .note-t{color:var(--g900);font-weight:600;overflow-wrap:anywhere}
.diff{font-family:var(--mono);font-size:12px}
.diff .a{color:#16a34a}.diff .d{color:#dc2626}

/* tools */
.trow{display:grid;grid-template-columns:40px minmax(0,1fr) 210px 196px;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--g100)}
.trow:last-child{border-bottom:0}
.tic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;border-width:1px;border-style:solid;flex:none}
.t-name{font-weight:600;color:var(--g900);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.usage-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--g500);margin-bottom:6px;gap:6px}
.quota{width:64px;height:26px;font-family:var(--mono);font-size:12.5px;padding:0 6px}
.seg{display:inline-flex;border:1px solid var(--g200);border-radius:8px;padding:2px;background:var(--g50)}
.seg button{border:0;background:transparent;padding:3px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--g500)}
.seg button.on{background:#fff;color:var(--g900);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button.on.m-auto{color:#15803d}
.seg button.on.m-ask{color:#b45309}
.seg button:disabled{cursor:not-allowed}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.scard{border:1px solid var(--g200);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.scard:hover{border-color:var(--g300);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.scard .top{display:flex;align-items:center;gap:10px}
.scard .sfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}

/* budget */
.vcard{border-radius:14px;padding:18px 20px;background:linear-gradient(135deg,#111827 0%,#374151 100%);color:#fff;aspect-ratio:1.586;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);position:relative;overflow:hidden}
.vcard.frozen{filter:grayscale(1) brightness(1.3)}
.vcard .chipg{width:36px;height:26px;border-radius:5px;background:var(--yellow)}
.vcard .num{font-size:18px;letter-spacing:.12em}
.vcard .row{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;letter-spacing:.06em;color:#d1d5db}
.vcard .net{font-family:var(--sans);font-weight:700;font-size:18px;color:#fff;font-style:italic}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--g100);gap:2px}
.legend{display:grid;gap:6px;margin-top:12px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .amt{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--g600)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--g500);font-size:13px;padding:9px 14px;background:var(--g50);border-bottom:1px solid var(--g200)}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--g100)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.tgl{width:34px;height:20px;border-radius:999px;background:var(--g300);border:0;position:relative;flex:none;padding:0;transition:background .2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--g900)}
.tgl.on::after{left:17px}
.tgl:disabled{opacity:.5;cursor:not-allowed}
.rule{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--g100);font-size:14px}
.rule:last-child{border-bottom:0}
input[type=range]{width:100%;accent-color:#111827}

/* calls */
.calls{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.crow{display:flex;gap:10px;align-items:center;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--g100);background:#fff;text-align:left}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--g50)}
.crow.on{background:var(--g50);box-shadow:inset 3px 0 0 var(--g900)}
.crow .who{flex:1;min-width:0}
.crow .who b{display:block;font-size:14px}
.crow .meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.transcript{max-height:470px;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tline{display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:8px;font-size:14px}
.tline.hide{display:none}
.tline .ts{font-family:var(--mono);font-size:12px;color:var(--g400);padding-top:2px}
.tline .who{font-size:13px;font-weight:600;color:var(--g600)}
.tline.bot .who{color:#7e22ce}
.tline.bot .t{color:var(--g800)}

/* ask */
.chat{display:flex;flex-direction:column;height:min(640px,72vh)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:780px;align-items:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:10px 14px;border-radius:10px;font-size:15px;border:1px solid var(--g200);background:var(--g50)}
.msg.user .bubble{background:var(--g900);color:#fff;border-color:var(--g900)}
.cite{margin-top:8px;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--g500);flex-wrap:wrap}
.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--g200)}
.chat-form .input{flex:1;height:38px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--g400);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.intro{margin:auto;text-align:center;max-width:460px;color:var(--g600)}
.intro .chips{justify-content:center;margin-top:14px}

/* footer, toasts */
.foot{border-top:1px solid var(--g200);background:var(--g50);padding:22px 0;font-size:14px;color:var(--g500)}
.foot .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--g700);display:inline-flex;align-items:center;gap:6px}
.foot a:hover{color:var(--g900);text-decoration:underline}
.foot .right{margin-left:auto}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100% - 40px)}
.toast{display:flex;align-items:center;gap:8px;background:var(--g900);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:tin .2s ease;transition:opacity .3s,transform .3s}
.toast svg{color:var(--yellow)}
.toast.err svg{color:#fca5a5}
.toast.out{opacity:0;transform:translateY(6px)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

body.public .team-only{display:none!important}

@media (max-width:900px){
  .layout,.split,.calls{grid-template-columns:1fr}
  .navlinks{display:none}
  .disc-grid{grid-template-columns:1fr}
  .disc-body{padding-left:14px}
  .trow{grid-template-columns:40px minmax(0,1fr)}
  .trow .t-usage,.trow .t-mode{grid-column:2}
}
@media (max-width:640px){
  .wrap{padding:0 14px}
  .brand .txt,.kbd{display:none}
  .team-toggle .lbl{display:none}
  .arow{grid-template-columns:22px minmax(0,1fr) 64px}
  .arow .tool,.arow .id,.arow .time{display:none}
  .md{padding:4px 16px 20px}
  .cols2{grid-template-columns:1fr}
  .head-right{margin-left:0}
  .kv{grid-template-columns:96px minmax(0,1fr)}
  .disc-meta .mono{display:none}
  .costs{grid-template-columns:1fr}
  .list-head .trunc{max-width:180px}
}
</style>

function spark(vals, w, h) {
  var max = Math.max.apply(null, vals), n = vals.length;
  var pts = vals.map(function (v, i) {
    return [(i * (w / (n - 1))).toFixed(1), (h - 3 - (v / (max || 1)) * (h - 8)).toFixed(1)];
  });
  var line = pts.map(function (p) { return p.join(','); }).join(' ');
  var area = '0,' + h + ' ' + line + ' ' + w + ',' + h;
  var last = pts[n - 1];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polygon points="' + area + '" fill="rgba(255,210,30,.25)"/>' +
    '<polyline points="' + line + '" fill="none" stroke="#111827" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.5" fill="#111827"/></svg>';

function filteredActions() {
  var f = state.filter, q = f.q.toLowerCase();

    if (f.status !== 'all' && a.status !== f.status) return false;
    if (f.tool !== 'all' && a.tool !== f.tool) return false;
    if (q) {
      var hay = (a.id + ' ' + a.title + ' ' + toolInfo(a.tool).name + ' ' + (a.reasoning || '') + ' ' + (a.output || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

  var spend = all.reduce(function (s, a) { return s + (a.status === 'executed' ? a.cost : 0); }, 0);

  var chips = ['all', 'executed', 'pending', 'blocked', 'failed', 'rejected'].map(function (s) {

      '<div class="stat"><div class="k">' + ic('ban', 13) + 'Blocked by policy</div><div class="v">' + count('blocked') + '</div></div>' +

/* ---------------------------------------------------------------- drawer */
function policyBox(a) {
  var p = state.approvals.find(function (x) { return x.actionId === a.id; });
  var cls, icon, head, body;
  if (a.status === 'blocked') { cls = 't-red'; icon = 'ban'; head = 'Blocked by PolicyEngine'; body = a.output; }
  else if (a.policy === 'approval' && a.status === 'pending') { cls = 't-amber'; icon = 'clock'; head = 'Waiting for a manager'; body = 'Rule: ' + (p ? p.why : 'requires approval') + '.'; }
  else if (a.status === 'rejected') { cls = 't-gray'; icon = 'xc'; head = 'Rejected by ' + (a.rejectedBy || 'a manager'); body = 'The action did not run.'; }
  else if (a.policy === 'approval') { cls = 't-green'; icon = 'checkc'; head = 'Approved by ' + (a.approvedBy || 'a manager'); body = 'Tool mode is Ask, so a human signed off before it ran.'; }
  else if (a.status === 'failed') { cls = 't-red'; icon = 'alert'; head = 'Auto-approved, then failed'; body = 'Policy allowed it; the tool returned an error.'; }
  else { cls = 't-green'; icon = 'checkc'; head = 'Auto-approved'; body = 'Within quota, tool mode Auto, no red-line matches.'; }
  return '<div class="policy ' + cls + '">' + ic(icon, 16) + '<div><b style="color:inherit">' + esc(head) + '</b><p>' + esc(body) + '</p></div></div>';
}
function jsonHtml(o) {
  return esc(JSON.stringify(o || {}, null, 2))
    .replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="jk">$1</span>$2')
    .replace(/: (&quot;.*?&quot;)/g, ': <span class="js">$1</span>')
    .replace(/: (-?\d+(?:\.\d+)?|true|false|null)/g, ': <span class="jn">$1</span>');
}
function openDetail(id) {
  var a = state.actions.find(function (x) { return x.id === id; });
  if (!a) { toast('Action ' + id + ' not found', 'err'); return; }
  state.drawerId = id;
  var tokens = a.tokens || 0;
  var model = Math.min(a.cost, tokens * 0.000022);
  var toolCost = Math.max(0, a.cost - model);
  var by = a.approvedBy ? 'Approved by ' + a.approvedBy : a.rejectedBy ? 'Rejected by ' + a.rejectedBy : a.policy === 'auto' ? 'Policy engine' : a.policy === 'blocked' ? 'Policy engine' : 'Pending';
  var foot = '';
  if (a.status === 'pending') foot += '<a class="btn primary team-only" href="#approvals" data-act="closeDrawer">' + ic('checkc', 14) + 'Review in Approvals</a>';
  foot += '<button class="btn" data-act="copy" data-text="' + esc(JSON.stringify({ id: a.id, tool: a.tool, input: a.input, output: a.output })) + '">' + ic('copy', 14) + 'Copy JSON</button>';
  foot += '<button class="btn" data-act="askAbout" data-id="' + a.id + '">' + ic('msg', 14) + 'Ask about this</button>';

  $('#drawer').innerHTML =
    '<div class="drawer-head">' + statusIcon(a.status) + '<span class="hash">' + a.id + '</span>' + statusTag(a.status) + toolPill(a.tool) +
      '<span class="right"><button class="icon-btn" data-act="closeDrawer" aria-label="Close">' + ic('close', 18) + '</button></span></div>' +
    '<div class="drawer-body">' +
      '<h3>' + esc(a.title) + '</h3>' +
      '<dl class="kv"><dt>Time</dt><dd class="mono">Today ' + esc(a.time) + '</dd>' +
        '<dt>Tool</dt><dd>' + esc(toolInfo(a.tool).name) + '</dd>' +
        '<dt>Policy</dt><dd>' + (a.policy === 'auto' ? 'Auto' : a.policy === 'approval' ? 'Ask first' : 'Blocked') + '</dd>' +
        '<dt>Decision</dt><dd>' + esc(by) + '</dd>' +
        '<dt>Tokens</dt><dd class="mono">' + (tokens ? fmt(tokens) : '—') + '</dd></dl>' +
      '<div class="sec"><h4>Reasoning</h4><p>' + esc(a.reasoning) + '</p></div>' +
      '<div class="sec"><h4>Policy decision</h4>' + policyBox(a) + '</div>' +
      '<div class="sec"><h4>Input</h4><pre class="json">' + jsonHtml(a.input) + '</pre></div>' +
      '<div class="sec"><h4>Output</h4><p>' + esc(a.output) + '</p></div>' +
      '<div class="sec"><h4>Cost</h4><div class="costs">' +
        '<div>Total<b>' + ils(a.cost) + '</b></div><div>Model<b>' + ils(Math.round(model * 100) / 100) + '</b></div><div>Tool / vendor<b>' + ils(Math.round(toolCost * 100) / 100) + '</b></div></div></div>' +
    '</div>' +
    '<div class="drawer-foot">' + foot + '</div>';
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#overlay').classList.add('open');
}

function refreshDisc(id) {
  var p = state.approvals.find(function (x) { return x.id === id; });
  var d = document.getElementById('d-' + id);
  if (!p || !d) return;
  var open = !!state.expanded[id];
  d.classList.toggle('open', open);
  d.querySelector('.disc-row').setAttribute('aria-expanded', String(open));
  d.querySelector('.disc-body').innerHTML = open ? discBody(p) : '';
}
function resolve(id, decision, edited) {
  var i = state.approvals.findIndex(function (p) { return p.id === id; });
  if (i < 0) return null;
  var p = state.approvals.splice(i, 1)[0];
  p.decision = decision; p.at = nowHM(); p.edited = !!edited;
  state.resolved.unshift(p);
  delete state.expanded[id]; delete state.editing[id];
  var a = state.actions.find(function (x) { return x.id === p.actionId; });
  var money = p.tool === 'ads' || p.tool === 'payments';
  var amount = p.preview.type === 'payment' ? Number(p.preview.amount) || 0 : p.cost;
  if (decision === 'approved') {
    if (a) {
      a.status = 'executed'; a.approvedBy = 'You';
      a.output = state.paused ? 'Approved by You' + (edited ? ' (edited)' : '') + '. Queued until the agent is resumed.' : 'Approved by You' + (edited ? ' (edited)' : '') + '. Executed.';
      if (money) a.cost = amount;
    }
    if (money) {
      var e = state.budget.expenses.find(function (x) { return x.status === 'pending'; });
      if (e) { e.status = 'approved'; e.amount = amount; }
      state.budget.monthlySpent += amount; state.budget.dailySpent += amount;
    }
  } else if (decision === 'declined') {
    if (a) { a.status = 'rejected'; a.rejectedBy = 'You'; a.output = 'Declined by You. The action did not run.'; }
    if (money) {
      var e2 = state.budget.expenses.find(function (x) { return x.status === 'pending'; });
      if (e2) e2.status = 'rejected';
    }
  } else if (a) {
    a.output += ' Sent back to the agent for a sourced rewrite.';
  }
  return p;
}

        return '<button class="crow' + (c.id === sel.id ? ' on' : '') + '" data-act="call" data-id="' + c.id + '"><span class="avatar md">' + initials(c.name) + '</span>' +
          '<span class="who"><b>' + esc(c.name) + '</b><span class="mono muted sm">' + esc(c.phone) + '</span></span>' +
          '<span class="meta">' + outcomeTag(c.outcome) + '<span class="mono muted sm">' + esc(c.time) + ' · ' + (c.duration ? dur(c.duration) : '—') + '</span></span></button>';
      }).join('') +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><span class="avatar xs">' + initials(sel.name) + '</span><b>' + esc(sel.name) + '</b><span class="mono sm">' + esc(sel.phone) + '</span>' + outcomeTag(sel.outcome) +
        '<span class="right"><span class="mono sm">' + esc(sel.time) + ' · ' + (sel.duration ? dur(sel.duration) : '0:00') + '</span>' +
        (sel.transcript.length ? '<button class="btn sm" data-act="replay">' + ic('play', 12) + 'Replay</button>' : '') + '</span></div>' +
      '<div class="pad" style="border-bottom:1px solid var(--g100)"><p style="margin:0 0 8px">' + esc(sel.summary) + '</p><div class="pills">' +
        sel.tags.map(function (t) { return '<span class="tag sm t-gray">' + esc(t) + '</span>'; }).join('') + '</div></div>' +
      '<div class="transcript" id="transcript">' + lines + '</div>' +
    '</div></div>';
}
function clearReplay() { if (state.replayTimer) { clearInterval(state.replayTimer); state.replayTimer = null; } }
function replay() {
  clearReplay();
  var box = $('#transcript');
  if (!box) return;
  var lines = Array.prototype.slice.call(box.querySelectorAll('.tline'));
  lines.forEach(function (l) { l.classList.add('hide'); });
  var i = 0;
  state.replayTimer = setInterval(function () {
    if (i >= lines.length || !document.body.contains(box)) { clearReplay(); return; }
    lines[i].classList.remove('hide');
    box.scrollTop = box.scrollHeight;
    i++;
  }, 700);
}

/* ------------------------------------------------------------ view: ask */
function actionTitle(id) { var a = state.actions.find(function (x) { return x.id === id; }); return a ? a.title : ''; }
function chatHtml() {
  if (!state.chat.length && !state.typing) {
    return '<div class="intro"><span class="tw-av" style="margin:0 auto 10px;width:44px;height:44px">' + logo(20) + '</span>' +
      '<b style="font-size:17px">Ask Megaphone anything about its work</b>' +
      '<p class="sm">Answers come from the public activity log and link to the action they are based on.</p>' +
      '<div class="chips">' + ['What did you do today?', 'Do you send spam?', 'How do you spend money?', 'Who do you call?', 'Are your facts verified?', 'Are you a real person?'].map(function (q) {
        return '<button class="chip" data-act="askChip" data-q="' + esc(q) + '">' + esc(q) + '</button>';
      }).join('') + '</div></div>';
  }
  var html = state.chat.map(function (m) {
    if (m.who === 'user') return '<div class="msg user"><span class="avatar xs" style="width:30px;height:30px">You</span><div class="bubble">' + esc(m.text) + '</div></div>';
    var c = m.ref
      ? '<div class="cite">' + ic('book', 12) + 'Source: <button class="link mono" data-act="goAction" data-id="' + m.ref + '">' + m.ref + '</button><span>· ' + esc(actionTitle(m.ref)) + '</span></div>'
      : m.matched ? '<div class="cite">' + ic('book', 12) + 'Source: campaign card (general answer)</div>' : '<div class="cite">' + ic('users', 12) + 'Forwarded to the human team</div>';
    return '<div class="msg bot"><span class="tw-av sm">' + logo(14) + '</span><div class="bubble"><div>' + esc(m.text) + '</div>' + c + '</div></div>';
  }).join('');
  if (state.typing) html += '<div class="msg bot"><span class="tw-av sm">' + logo(14) + '</span><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div></div>';
  return html;
}
function vAsk() {
  return '<div class="split"><div class="card chat">' +
      '<div class="card-head"><span class="mark xs">' + logo(11) + '</span><b>Ask Megaphone</b><span class="muted sm">answers from the public log</span>' +
        '<span class="right"><button class="btn sm" data-act="clearChat">Clear</button></span></div>' +
      '<div class="msgs" id="msgs">' + chatHtml() + '</div>' +
      '<form class="chat-form" data-form="ask"><input class="input" name="q" placeholder="Ask a question, e.g. how much did you spend today?" autocomplete="off" aria-label="Question"><button class="btn primary" type="submit">' + ic('send', 14) + 'Send</button></form>' +
    '</div>' +
    '<div><div class="card"><div class="card-head">' + ic('shield', 15) + 'How answers work</div><div class="pad sm" style="color:var(--g600)">' +
      '<p style="margin:0 0 8px">Megaphone only answers from what it has logged. Every answer links to the action ID it came from, so you can check the reasoning, inputs and cost yourself.</p>' +
      '<p style="margin:0">If it doesn\'t know, it says so and forwards the question to the human team.</p></div></div>' +
      '<div class="card" style="margin-top:16px"><div class="card-head">' + ic('history', 15) + 'Recently cited</div>' +
        ['A-1073', 'A-1087', 'A-1086', 'A-1085'].map(function (id) {
          return '<div class="hist-row"><button class="link mono sm" data-act="goAction" data-id="' + id + '">' + id + '</button><span class="sm" style="flex:1;min-width:0">' + esc(actionTitle(id)) + '</span></div>';
        }).join('') + '</div></div></div>';
}
function renderChat() {
  var box = $('#msgs');
  if (!box) return;
  box.innerHTML = chatHtml();
  box.scrollTop = box.scrollHeight;
}
function answer(q) {
  var low = q.toLowerCase(), words = low.match(/[a-z]+/g) || [];
  var best = null, bs = 0;
  D.qa.forEach(function (item) {
    var s = 0;
    item.keys.forEach(function (k) {
      var hit = k.indexOf(' ') > -1
        ? low.indexOf(k) > -1
        : words.some(function (w) { return w === k || (k.length >= 4 && w.indexOf(k) === 0); });
      if (hit) s++;
    });
    if (s > bs) { bs = s; best = item; }
  });
  if (best) return { text: best.answer, ref: best.ref, matched: true };
  return { text: 'I don\'t have a logged answer for that yet. I\'ve passed your question to the human team. You can also browse everything I\'ve done in the Activity tab.', ref: null, matched: false };
}
function ask(q) {
  q = String(q || '').trim();
  if (!q) return;
  state.chat.push({ who: 'user', text: q });
  state.typing = true;
  renderChat();
  setTimeout(function () {
    var r = answer(q);
    state.chat.push({ who: 'bot', text: r.text, ref: r.ref, matched: r.matched });
    state.typing = false;
    renderChat();
  }, 750);
}

/* ---------------------------------------------------------------- router */
var VIEWS = { campaign: vCampaign, activity: vActivity, approvals: vApprovals, prompt: vPrompt, tools: vTools, budget: vBudget, calls: vCalls, ask: vAsk };
function renderView() {
  $('#view').innerHTML = VIEWS[state.tab]();
  if (state.tab === 'ask') { var b = $('#msgs'); if (b) b.scrollTop = b.scrollHeight; }
  $('#footVer').textContent = state.prompt.version;
}
function render() { renderTags(); renderTabs(); renderView(); }
function route() {
  var h = decodeURIComponent(location.hash.slice(1));
  var parts = h.split('/');
  var t = parts[0];
  var prev = state.tab;
  state.tab = TABS.some(function (x) { return x.id === t; }) ? t : 'campaign';
  clearReplay();
  render();
  if (prev !== state.tab) {
    var top = $('#tabs').getBoundingClientRect().top + window.scrollY - 60;
    if (window.scrollY > top) window.scrollTo(0, Math.max(0, top));
  }
  if (state.tab === 'activity' && parts[1]) openDetail(parts[1]);
}
function go(tab) {
  if (state.tab === tab && location.hash === '#' + tab) renderView();
  else location.hash = tab;
}

/* ----------------------------------------------------------------- toast */
function toast(msg, kind) {
  var t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.innerHTML = ic(kind === 'err' ? 'alert' : 'checkc', 16) + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(t);
  setTimeout(function () { t.classList.add('out'); }, 2600);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
}
function copyText(text) {
  try {
    navigator.clipboard.writeText(text).then(function () { toast('Copied to clipboard'); }, function () { toast('Copied (mock)'); });
  } catch (e) { toast('Copied (mock)'); }
}

/* -------------------------------------------------------------- handlers */
function findAppr(id) { return state.approvals.find(function (x) { return x.id === id; }); }
var H = {
  open: function (el) { openDetail(el.dataset.id); },
  closeDrawer: closeDrawer,
  goAction: function (el) {
    if (state.tab !== 'activity') location.hash = 'activity';
    openDetail(el.dataset.id);
  },
  askAbout: function (el) {
    var a = state.actions.find(function (x) { return x.id === el.dataset.id; });
    closeDrawer();
    if (!a) return;
    state.chat.push({ who: 'user', text: 'Why did you do ' + a.id + '?' });
    state.chat.push({ who: 'bot', text: a.reasoning + ' Result: ' + a.output, ref: a.id, matched: true });
    go('ask');
  },
  fStatus: function (el) { state.filter.status = el.dataset.s; renderView(); },
  clearQ: function () { state.filter.q = ''; $('#globalSearch').value = ''; renderView(); },
  toggleAppr: function (el) {
    var id = el.dataset.id;
    state.expanded[id] = !state.expanded[id];
    if (!state.expanded[id]) delete state.editing[id];
    refreshDisc(id);
  },
  edit: function (el) {
    var id = el.dataset.id;
    state.editing[id] = true;
    refreshDisc(id);
    var f = document.getElementById('ed-' + id);
    if (f) f.focus();
  },
  cancelEdit: function (el) { delete state.editing[el.dataset.id]; refreshDisc(el.dataset.id); },
  saveEdit: function (el) {
    var id = el.dataset.id, p = findAppr(id);
    if (!p) return;
    var f = document.getElementById('ed-' + id), pv = p.preview;
    if (!f) return;
    if (pv.type === 'email') {
      var s = document.getElementById('eds-' + id);
      if (s) pv.subject = s.value;
      pv.body = f.value;
    } else if (pv.type === 'payment') {
      var amt = Math.max(0, Number(f.value) || 0);
      pv.amount = amt; p.cost = amt; p.title = 'Boost dues thread · ' + ils(amt);
    } else if (pv.type === 'tweet') {
      pv.text = f.value;
    } else {
      pv.script = f.value;
    }
    var r = resolve(id, 'approved', true);
    render();
    if (r) toast('Edited and approved: ' + r.title + (state.paused ? ' (queued, agent paused)' : ''));
  },
  approve: function (el) {
    var r = resolve(el.dataset.id, 'approved', false);
    render();
    if (r) toast('Approved: ' + r.title + (state.paused ? ' (queued, agent paused)' : ''));
  },
  decline: function (el) {
    var r = resolve(el.dataset.id, 'declined', false);
    render();
    if (r) toast('Declined: ' + r.title);
  },
  sendBack: function (el) {
    var r = resolve(el.dataset.id, 'returned', false);
    render();
    if (r) toast('Sent back to Megaphone for a sourced rewrite');
  },
  promptEdit: function () {
    state.prompt.editing = true;
    renderView();
    var t = $('#promptEdit');
    if (t) t.focus();
  },
  promptCancel: function () { state.prompt.editing = false; renderView(); },
  commit: function () {
    var P = state.prompt, ta = $('#promptEdit'), msgEl = $('#commitMsg');
    if (!ta) return;
    var txt = ta.value;
    var msg = (msgEl && msgEl.value.trim()) || 'Update system_prompt.md';
    if (txt === P.text) { toast('No changes to commit', 'err'); return; }
    var oldL = P.text.split('\n'), newL = txt.split('\n');
    var add = newL.filter(function (l) { return oldL.indexOf(l) === -1; }).length;
    var del = oldL.filter(function (l) { return newL.indexOf(l) === -1; }).length;
    P.version++;
    P.versions.unshift({ v: P.version, by: 'You', when: 'Just now', note: msg, add: add, del: del, text: txt });
    P.text = txt;
    P.editing = false;
    renderView();
    toast('Committed v' + P.version + ': ' + msg);
  },
  restore: function (el) {
    var P = state.prompt, v = Number(el.dataset.v);
    var h = P.versions.find(function (x) { return x.v === v; });
    if (!h || !h.text) return;
    var oldL = P.text.split('\n'), newL = h.text.split('\n');
    P.version++;
    P.versions.unshift({
      v: P.version, by: 'You', when: 'Just now', note: 'Restore v' + v, text: h.text,
      add: newL.filter(function (l) { return oldL.indexOf(l) === -1; }).length,
      del: oldL.filter(function (l) { return newL.indexOf(l) === -1; }).length
    });
    P.text = h.text;
    renderView();
    toast('Restored v' + v + ' as v' + P.version);
  },
  mode: function (el) {
    var t = state.tools.find(function (x) { return x.id === el.dataset.id; });
    if (!t || t.mode === el.dataset.m) return;
    t.mode = el.dataset.m;
    renderView();
    var lbl = { off: 'Off', ask: 'Ask first', auto: 'Auto' }[t.mode];
    toast(t.name + ' set to ' + lbl);
  },
  addTool: function (el) {
    var i = state.store.findIndex(function (s) { return s.id === el.dataset.id; });
    if (i < 0) return;
    var s = state.store.splice(i, 1)[0];
    state.tools.push({ id: s.id, name: s.name, icon: s.icon, mode: 'off', quota: 10, used: 0, unit: 'actions / day', desc: s.desc, provider: s.via });
    renderView();
    toast(s.name + ' added (Off). Set a mode to enable it.');
  },
  rule: function (el) {
    var r = state.budget.rules.find(function (x) { return x.id === el.dataset.id; });
    if (!r) return;
    r.on = !r.on;
    $('#rules').innerHTML = rulesHtml();
    toast((r.on ? 'Enabled: ' : 'Disabled: ') + r.text.replace(/\{auto\}/g, fmt(state.budget.autoLimit)));
  },
  freeze: function () {
    state.frozen = !state.frozen;
    renderView();
    toast(state.frozen ? 'Card frozen. All payments will be declined.' : 'Card unfrozen');
  },
  call: function (el) { state.callId = el.dataset.id; clearReplay(); renderView(); },
  replay: replay,
  askChip: function (el) {
    ask(el.dataset.q);
    if (state.tab !== 'ask') location.hash = 'ask';
  },
  clearChat: function () { state.chat = []; state.typing = false; renderChat(); },
  pause: function () {
    state.paused = !state.paused;
    renderTags(); renderPause();
    if (state.tab === 'campaign') renderView(); else updateLive();
    toast(state.paused ? 'Agent paused. Nothing new will run until resumed.' : 'Agent resumed');
  },
  team: function () {
    state.team = !state.team;
    document.body.classList.toggle('public', !state.team);
    $('#teamSwitch').classList.toggle('on', state.team);
    if (!state.team) { state.prompt.editing = false; state.editing = {}; }
    render();
    toast(state.team ? 'Team view: management controls on' : 'Public view: what visitors see');
  },
  like: function () {
    state.liked = !state.liked;
    state.supporters += state.liked ? 1 : -1;
    renderCounters();
    if (state.liked) toast('Thanks for supporting the campaign');
  },
  follow: function () {
    state.followed = !state.followed;
    state.followers += state.followed ? 1 : -1;
    renderCounters();
  },
  copy: function (el) { copyText(el.dataset.text || ''); },
  docs: function () {
    setTimeout(function () { var r = $('#readme'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
  },
  toastOnly: function (el) { toast(el.dataset.msg || 'Done'); }
};

var CH = {
  fTool: function (el) { state.filter.tool = el.value; renderView(); },
  quota: function (el) {
    var t = state.tools.find(function (x) { return x.id === el.dataset.id; });
    if (!t) return;
    t.quota = Math.max(0, parseInt(el.value, 10) || 0);
    renderView();
    toast(t.name + ' quota set to ' + t.quota + ' ' + t.unit);
  },
  autoLimitDone: function () { toast('Auto-approve limit set to ' + ils(state.budget.autoLimit)); }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = H[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-change]');
  if (!el) return;
  var fn = CH[el.dataset.change];
  if (fn) fn(el, e);
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.input === 'autoLimit') {
    state.budget.autoLimit = Number(el.value) || 0;
    var v = $('#autoVal');
    if (v) v.textContent = ils(state.budget.autoLimit);
    var r = $('#rules');
    if (r) r.innerHTML = rulesHtml();
  }
});
document.addEventListener('submit', function (e) {
  var f = e.target;
  if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  var inp = f.querySelector('input[name="q"]');
  var q = inp ? inp.value : '';
  if (!q.trim()) return;
  if (inp) inp.value = '';
  ask(q);
  if (f.dataset.form === 'mini') location.hash = 'ask';
});
document.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape' && state.drawerId) closeDrawer();
  if (e.key === '/' && tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
    e.preventDefault();
    $('#globalSearch').focus();
  }
});
$('#globalSearch').addEventListener('input', function (e) {
  state.filter.q = e.target.value.trim();
  if (state.tab !== 'activity') location.hash = 'activity';
  else renderView();
});
window.addEventListener('hashchange', route);

/* ------------------------------------------------------------ simulation */
function simulate() {
  if (state.paused || state.liveIdx >= D.liveEvents.length) return;
  var ev = clone(D.liveEvents[state.liveIdx++]);
  var id = 'A-' + (state.nextId++);
  var a = {
    id: id, time: nowHM(), tool: ev.tool, title: ev.title, status: ev.status, policy: ev.policy, cost: ev.cost,
    tokens: 800 + Math.floor(Math.random() * 4000), reasoning: ev.reasoning, output: ev.output,
    input: { trigger: 'live monitor', tool: ev.tool }, fresh: true
  };
  state.actions.unshift(a);
  state.added++;
  var tool = state.tools.find(function (t) { return t.id === ev.tool; });
  if (tool && ev.status === 'executed') tool.used += ev.tool === 'payments' ? ev.cost : 1;
  if (ev.tool === 'payments' && ev.status === 'executed') {
    state.budget.dailySpent += ev.cost;
    state.budget.monthlySpent += ev.cost;
    state.budget.expenses.unshift({ time: 'Today ' + a.time, vendor: 'Unsplash+', desc: 'Stock photo license', amount: ev.cost, status: 'auto' });
  }
  if (ev.status === 'pending') {
    state.approvals.unshift({
      id: 'P-' + (state.nextP++), actionId: id, tool: ev.tool, title: 'Research summary to 3 journalists', why: 'Email always requires approval', risk: 'Low', cost: ev.cost,
      audience: '3 journalists from the press list', reasoning: ev.reasoning,
      preview: { type: 'email', subject: 'Research summary: union finances (6 pages, sourced)', body: 'Hi {first_name},\n\nAs requested, here is our 6-page research summary on union financial transparency. Every claim links to a primary source.\n\nHappy to answer questions or connect you with our team.\n\nThis message was written by Megaphone, the campaign\'s AI agent, and approved by our team.\n\n— Transparent Histadrut' }
    });
    toast('New approval request: ' + ev.title);
  }
  renderTabs();
  var editingSomething = Object.keys(state.editing).length > 0 || state.prompt.editing;
  if (state.tab === 'activity' || (state.tab === 'approvals' && ev.status === 'pending' && !editingSomething)) renderView();
  setTimeout(function () { a.fresh = false; }, 1700);
}

/* ------------------------------------------------------------------ init */
$('#logoMark').innerHTML = logo(17);
$('#logoMark2').innerHTML = logo(13);
$('#searchIcon').innerHTML = ic('search', 15);
$('#copyBtn').innerHTML = ic('copy', 15);
$('#footOps').innerHTML = ic('bolt', 14) + 'Full ops room';
$('#footCalm').innerHTML = ic('eye', 14) + 'Calm version';
renderCounters();
renderPause();
route();
setInterval(function () {
  if (state.paused) return;
  state.thought = (state.thought + 1) % D.thoughts.length;
  updateLive();
}, 4500);
setInterval(simulate, 22000);
})();
