<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Megaphone · Campaign Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Instrument Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            ink: {
              950: '#05070a',
              900: '#080b10',
              850: '#0b0f16',
              800: '#0f141c',
              700: '#161c27',
              600: '#1f2734',
            },
            neon: {
              green: '#2bff9a',
              amber: '#ffb224',
              red: '#ff3d5e',
              cyan: '#2ee6ff',
              violet: '#9b7bff',
            },
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-ink-950 text-slate-200 font-sans antialiased">
  <div class="bg-grid fixed inset-0 pointer-events-none"></div>
  <div class="bg-glow fixed inset-0 pointer-events-none"></div>

  <div id="login-gate" class="login-gate">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="flex items-center gap-3 mb-6">
        <div class="logo-mark"><i data-lucide="megaphone" class="w-5 h-5"></i></div>
        <div>
          <div class="font-bold text-white text-lg">Megaphone</div>
          <div class="text-[11px] text-slate-500">Private demo · enter credentials</div>
        </div>
      </div>
      <label class="block text-xs text-slate-500 mb-1.5 font-semibold uppercase tracking-wider">Username</label>
      <input id="login-user" name="username" type="text" class="login-input" placeholder="username" autocomplete="username" required />
      <label class="block text-xs text-slate-500 mb-1.5 mt-4 font-semibold uppercase tracking-wider">Password</label>
      <input id="login-pass" name="password" type="password" class="login-input" placeholder="password" autocomplete="current-password" required />
      <p id="login-error" class="login-error hidden">Wrong username or password</p>
      <button type="submit" class="btn-primary w-full mt-5">Enter demo</button>
    </form>
  </div>

  <div id="admin-shell" class="relative flex min-h-screen hidden">
    <aside id="sidebar" class="hidden lg:flex w-64 shrink-0 flex-col border-r border-white/5 bg-ink-900/80 backdrop-blur-xl sticky top-0 h-screen">
      <div class="p-5 flex items-center gap-3 border-b border-white/5">
        <div class="logo-mark"><i data-lucide="megaphone" class="w-5 h-5"></i></div>
        <div>
          <div class="font-bold text-white leading-tight tracking-tight">Megaphone</div>
          <div class="text-[11px] text-slate-500">Ops room · Histadrut Transparency</div>
        </div>
      </div>
      <nav id="nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
      <div class="p-4 border-t border-white/5">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-neon-violet to-neon-cyan grid place-items-center text-ink-950 font-bold text-sm">YC</div>
          <div class="text-sm">
            <div class="text-white font-medium">Yoav Cohen</div>
            <div class="text-[11px] text-slate-500">Campaign lead · full access</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="flex-1 min-w-0 flex flex-col">
      <header id="topbar" class="sticky top-0 z-30 border-b border-white/5 bg-ink-950/70 backdrop-blur-xl">
        <div class="flex items-center gap-4 px-4 sm:px-6 h-16">
          <button id="mobile-nav-btn" class="lg:hidden btn-ghost" aria-label="Menu">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div id="agent-pill" class="agent-pill"></div>
          <div class="hidden md:flex items-center gap-2 text-xs text-slate-500 font-mono" id="clock"></div>
          <div class="flex-1"></div>
          <a href="#/public" class="btn-ghost text-sm">
            <i data-lucide="globe" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Public page</span>
          </a>
          <button id="kill-btn" class="kill-btn">
            <i data-lucide="octagon-x" class="w-4 h-4"></i>
            <span>Kill switch</span>
          </button>
        </div>
      </header>
      <main id="view" class="flex-1 relative"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 w-80 max-w-[calc(100vw-2.5rem)]"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
